name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan known vulnerabilities
        run: make vuln-check
      - run: make test check build
      - name: Check native macOS credential persistence
        if: runner.os == 'macOS'
        run: ./bin/bambu-tui doctor
      - name: Package release candidates
        if: runner.os == 'macOS'
        run: make release COMMIT="${{ github.sha }}"
      - name: Verify checksums
        if: runner.os == 'macOS'
        working-directory: dist
        run: shasum -a 256 -c "bambu-tui_v$(cat ../VERSION)_checksums.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'macOS'
        with:
          name: release-candidates
          path: |
            dist/*_macos_*.tar.gz
            dist/*_linux_*.tar.gz
            dist/*checksums.txt
          retention-days: 14
