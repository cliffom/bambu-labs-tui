name: Formatting and lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check documentation policy and links
        run: make docs-check
      - name: Test browser interactions
        run: node --test tools/test-browser-notices.cjs tools/test-browser-notifications.cjs tools/test-browser-themes.cjs
      - name: Check Go formatting
        run: make fmt-check
      - name: Audit fault codes against pinned upstream catalogues
        run: make audit-faults
      - name: Lint Go code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
      - name: Install workflow linter
        run: GOBIN="$PWD/bin/tools" go install "github.com/rhysd/actionlint/cmd/actionlint@$(cat .actionlint-version)"
      - name: Validate GitHub Actions workflows
        run: make lint-actions ACTIONLINT=./bin/tools/actionlint
      - name: Install Makefile linter
        run: GOBIN="$PWD/bin/tools" go install "github.com/checkmake/checkmake/cmd/checkmake@$(cat .checkmake-version)"
      - name: Lint Makefile
        run: make lint-make CHECKMAKE=./bin/tools/checkmake
