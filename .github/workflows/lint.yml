name: Formatting and lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check documentation policy and links
        run: make docs-check
      - name: Check Go formatting
        run: make fmt-check
      - name: Audit fault codes against pinned upstream catalogues
        run: make audit-faults
      - name: Lint Go code
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
      - name: Install workflow linter
        run: GOBIN="$PWD/bin/tools" go install "github.com/rhysd/actionlint/cmd/actionlint@$(cat .actionlint-version)"
      - name: Validate GitHub Actions workflows
        run: make lint-actions ACTIONLINT=./bin/tools/actionlint
      - name: Install Makefile linter
        run: GOBIN="$PWD/bin/tools" go install "github.com/checkmake/checkmake/cmd/checkmake@$(cat .checkmake-version)"
      - name: Lint Makefile
        run: make lint-make CHECKMAKE=./bin/tools/checkmake
