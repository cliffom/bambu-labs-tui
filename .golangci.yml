version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - decorder
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: true
      disable-dec-num-check: false
      disable-const-dec-num-check: true
      disable-var-dec-num-check: true
