# Copy to the path printed by `bambu-tui --config-path`.
region = "global" # global or china
low_filament_percent = 10
# Optional JSON theme, loaded at startup. Relative paths resolve beside this file.
# Download complete examples from internal/ui/themes/ in the repository.
# theme_file = "gruvbox-dark.json"

# Farm view follows this config path across accounts/regions, including demo.
# F/S saves changes; dashboard 0 resets both. Unknown values fall back independently.
[view]
filter = "all" # all, attention, printing, unavailable
sort = "name" # name, attention, state, finish

# Optional read-only browser dashboard. Config (,) > Web Server shows the URL.
# Localhost only; fails visibly if the configured port is in use. Stops with this TUI.
[web_server]
enabled = false
port = 8080 # 1..65535; 0/automatic port selection is not supported

# Automatic modals default on; macOS desktop delivery is opt-in.
[alerts]
automatic_modals = true
# Opt-in macOS desktop delivery; independent of automatic_modals.
desktop_notifications = false
notification_sound = false
completed_prints = true
filament = true
extrusion = true
printer_faults = true
failed_prints = true
unknown_pauses = true
# Optional farm-wide grouping across reports, printers, and completions (0 disables).
burst_window_seconds = 0 # 0..60; automatic attempts always limited to 12/minute

# Optional quiet schedule: desktop banners and sound only, no urgent bypass.
# No exit summary or replay; modals, monitoring, and reviews are independent.
# Days identify the START day of an overnight period. Restart after file edits.
[alerts.quiet_hours]
enabled = false
timezone = "America/Los_Angeles" # explicit IANA timezone, never host Local
start = "22:00" # inclusive local wall time
end = "07:00" # exclusive; must differ from start
days = "mon,tue,wed,thu,fri,sat,sun"

# Optional per-printer overrides inherit every unspecified global value.
# Use Config (,) > Printers for On / Off / Inherit and reset controls.
# Press s to find the stable printer ID. Restart after external file edits.
# [alerts.printers."YOUR_PRINTER_ID"]
# automatic_modals = false
# filament = false
